# Point these at your machines. Use LAN IPs for the first build, then
# switch to Tailscale names once the nodes have joined.

[kiosk]
kioskbox ansible_host=192.168.1.48 ansible_user=max

[guacamole]
guacbox ansible_host=192.168.1.48 ansible_user=max

[all:vars]
ansible_python_interpreter=/usr/bin/python3
